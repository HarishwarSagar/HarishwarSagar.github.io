<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Harishwar Sagar</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FBF6ED;--ink:#16110A;--ink2:#5D5546;--grad:linear-gradient(92deg,#FF4D00 0%,#F43F5E 52%,#FFB200 115%)}
  *{margin:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Inter",sans-serif;text-align:center;padding:24px}
  h1{font-family:"Syne",sans-serif;font-weight:800;font-size:clamp(5rem,22vw,11rem);line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:var(--ink2);margin-top:14px;font-size:1.02rem}
  .k{font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:#FF4D00}
  a{display:inline-block;margin-top:26px;padding:15px 30px;border-radius:999px;background:var(--grad);color:#FFF8EF;font-weight:600;text-decoration:none;box-shadow:0 14px 34px -12px rgba(255,77,0,.55);transition:transform .3s}
  a:hover{transform:scale(1.05)}
</style>
</head>
<body>
  <div>
    <span class="k">Lost in the funnel</span>
    <h1>404</h1>
    <p>This page didn't convert. Let's route you back to the pipeline.</p>
    <a href="/">&larr; Back home</a>
  </div>
</body>
</html>
